minimumReleaseAge: 11520
minimumReleaseAgeExclude:
  - "@every-app/*"
  # TEMPORARY (remove after 2026-08-15): workers-oauth-provider 0.10.2 was
  # published 2026-08-07; needed for the MCP SDK v2 migration plus the
  # ChatGPT DCR client-auth-negotiation fix.
  - "@cloudflare/workers-oauth-provider"
  # TEMPORARY (remove after 2026-08-09): security releases published
  # 2026-07-30/31; required to clear current high-severity advisories.
  - "brace-expansion"
  - "fast-uri"
  - "js-yaml"
  # TEMPORARY (remove after 2026-07-16): alchemy 2.0.0-beta.61 and its
  # matching @distilled.cloud/*@0.28.2 published 2026-07-08 — 2 days shy of
  # the window. Exact-pinned in package.json.
  - "alchemy"
  - "@distilled.cloud/*"

# Advisories triaged as not applicable. Re-review when the parent updates.
# - GHSA-67mh-4wv8-2f99: esbuild <=0.24.2 dev-server CORS. Only reachable via
#   drizzle-kit's bundled @esbuild-kit loader (dev-time CLI); drizzle-kit never
#   starts esbuild's serve mode, so the vulnerable path cannot execute.
auditConfig:
  ignoreGhsas:
    - GHSA-67mh-4wv8-2f99

# Security floors (added 2026-07) for transitive deps with published advisories
# where the parent hasn't shipped a bump yet. Each range sits inside what the
# parent already declares, so these are lockfile nudges, not forks. Ranges are
# major-bounded (^) on purpose: an override REPLACES the parent's range, so an
# open-ended >= floor would let a future major (e.g. hono 5) get forced onto a
# parent that only supports the current one.
#
# To prune once a parent catches up: delete the line, run `pnpm install`, and
# keep it deleted if `pnpm audit` stays clean.
overrides:
  # GHSA-4x5r-pxfx-6jf8 — waiting on @tanstack/devtools-vite
  "@babel/core": "^7.29.6"
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr plus earlier — waiting on just-bash
  brace-expansion: "^5.0.12"
  # GHSA-737v-mqg7-c878 — waiting on better-auth
  defu: "^6.1.5"
  # GHSA-6688-9rhm-gjv2, GHSA-55q2-fjhq-7xh7 plus earlier XSS advisories — waiting on posthog-js
  dompurify: "^3.4.16"
  # GHSA-qw65-cvwx-89v3, GHSA-hrr3-gc8f-f4qj plus earlier — waiting on @modelcontextprotocol/sdk
  fast-uri: "^3.1.8"
  # GHSA-5r4p-p66f-jhc7, GHSA-hxh3-vqpv-xpqv plus earlier (CORS etc.) — waiting on @modelcontextprotocol/sdk
  hono: "^4.13.11"
  # GHSA-j6r3-76f7-8jcv, GHSA-h3mg-xc3c-68pw plus earlier — waiting on @modelcontextprotocol/sdk
  ip-address: "^10.7.1"
  # GHSA-2883-xcg3-v3hh plus earlier — waiting on @tanstack/start-plugin-core
  js-yaml: "^4.3.2"
  # GHSA-587h-7wmj-h5pm plus earlier — waiting on @tanstack/devtools-vite
  launch-editor: "^2.14.2"
  # GHSA-qx2v-qp2m-jg93, GHSA-r28c-9q8g-f849 — waiting on vite
  postcss: "^8.5.18"
  # GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g plus earlier — waiting on @modelcontextprotocol/sdk
  qs: "^6.16.0"
  # GHSA-pqg4-j6r4-53mv plus earlier — waiting on @tanstack/devtools-vite
  shell-quote: "^1.11.0"
  # GHSA-7w5x-hrqm-74c2, GHSA-r4xh-jqrq-34v2 plus earlier — waiting on knip
  smol-toml: "^1.9.0"
  # GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3 plus earlier — waiting on cheerio + miniflare
  undici: "^7.29.1"
  # 2026-10 sweep. Same rule as above: each range stays inside the parent's
  # declared range and major unless noted.
  "@ai-sdk/provider-utils@4": "^4.0.33" # GHSA-866g-f22w-33x8 — ai / @ai-sdk/react
  "@hono/node-server@1": "^1.19.15" # GHSA-frvp-7c67-39w9 — @modelcontextprotocol/sdk
  "body-parser@2": "^2.3.0" # GHSA-v422-hmwv-36x6 — express 5
  "proxy-addr@2": "^2.0.8" # GHSA-jqcg-44mw-7w3h — express 5
  browserslist: "^4.28.7" # GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g — @babel/core
  baseline-browser-mapping: "^2.11.0" # GHSA-w5vr-8v7q-w6rv — browserslist
